[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-demo"
version = "0.0.1"
description = "A literate synthetic-market analysis example"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/agnesprovost/dummyProjectFroPublishingNotebooks"
Documentation = "https://agnesprovost.github.io/dummyProjectFroPublishingNotebooks/"

[tool.setuptools]
py-modules = ["market_demo"]
package-dir = {"" = "src"}

[tool.nbdev]
lib_name = "market_demo"
branch = "main"
min_python = "3.11"
lib_path = "src"
nbs_path = "nbs"
doc_path = "_docs"
recursive = true
