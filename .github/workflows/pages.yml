name: Publish Quarto site

# Build on main updates; allow a manual rerun from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant the Pages deploy action only the permissions it needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an outdated deployment when a newer main push arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Render all Quarto documents, including the executed Jupyter notebook,
      # into the project's configured output directory (_site/).
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      # Upload the generated static files and publish them to GitHub Pages.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload rendered site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
