name: Python tests

# Test changes on pushes and pull requests; this workflow does not deploy.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Keep the test command the same as the local README instructions.
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
